name: moroccan-food-hub

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moroccan_food_hub}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 20

  db-migrate:
    build:
      context: .
      target: backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/moroccan_food_hub}
    command:
      [
        "sh",
        "-lc",
        "pnpm --filter @workspace/scripts run wait-for-database && pnpm --filter @workspace/db run push-force && pnpm --filter @workspace/scripts run migrate",
      ]
    depends_on:
      - db
    restart: "no"

  backend:
    build:
      context: .
      target: backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/moroccan_food_hub}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-me}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MFA_ENABLED: ${MFA_ENABLED:-true}
      DOCUMENT_HOLD_MINUTES: ${DOCUMENT_HOLD_MINUTES:-30}
      PAYMENT_DEADLINE_HOURS: ${PAYMENT_DEADLINE_HOURS:-24}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uploads-data:/app/uploads
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  mobile:
    build:
      context: .
      target: mobile
    environment:
      CI: "1"
      PORT: 3003
      EXPO_PUBLIC_API_BASE_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3003:3003"
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  seed:
    profiles: ["seed"]
    build:
      context: .
      target: backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@db:5432/moroccan_food_hub}
    command:
      [
        "sh",
        "-lc",
        "pnpm --filter @workspace/scripts run wait-for-database && pnpm --filter @workspace/scripts run seed",
      ]
    depends_on:
      db:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres-data:
  uploads-data:
